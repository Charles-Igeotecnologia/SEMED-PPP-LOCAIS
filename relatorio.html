<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatório de localização | SEMED Manaus</title>
<style>
*{box-sizing:border-box}
html{scroll-padding-top:1rem}
body{margin:0;background:#edf3f4;color:#173343;font:16px/1.5 system-ui,sans-serif}
header{background:#173343;color:#fff}
.wrap{max-width:57rem;margin:auto;padding:1.25rem}
.eyebrow{margin:0;color:#c5e9e9;font-weight:700;font-size:.85rem}
h1{margin:.25rem 0 .75rem;font-size:clamp(1.6rem,4.5vw,2.25rem);line-height:1.15}
.actions,nav{display:flex;flex-wrap:wrap;gap:.5rem}
a{color:#0b5364;font-weight:650;text-underline-offset:.18em}
.actions a{padding:.5rem .75rem;border:1px solid #bbd3db;border-radius:6px;color:#fff}
.actions a[download]{background:#fff;color:#173343}
nav{padding-bottom:1.25rem}
nav a{background:#fff;border:1px solid #c5d7de;border-radius:6px;padding:.42rem .7rem}
a:focus-visible{outline:3px solid #0e7a87;outline-offset:3px}
header a:focus-visible{outline-color:#f2d968}
section+section{margin-top:1.65rem}
h2{margin:0 0 .45rem;font-size:1.1rem}
img{display:block;width:100%;height:auto;border:1px solid #c5d7de;background:#fff;box-shadow:0 3px 14px #17334318}
footer{margin-top:1.5rem}
</style>
</head>
<body id="topo">
<header>
  <div class="wrap">
    <p class="eyebrow">SEMED Manaus · PPP</p>
    <h1>Relatório de localização</h1>

  </div>
</header>
<main class="wrap">
